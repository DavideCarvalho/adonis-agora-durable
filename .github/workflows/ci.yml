name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.12.1
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm build

  # The suite runs on every Node line we support (the range `engines.node` promises): the lines Node
  # itself still maintains that AdonisJS 7 also accepts (it requires >=24).
  # Lint, typecheck and build stay on the single pinned version above: only the test run is multiplied.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    name: test (node ${{ matrix.node }})
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      # MySQL for the specs that opt into it (`dbBackends({ mysql: true })`): the Lucid store contract
      # and the db transport's run queue. Data on tmpfs, so the per-test DDL
      # stays fast; every test gets a database of its own.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --tmpfs /var/lib/mysql
          --health-cmd "mysqladmin ping -uroot -proot --silent"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 60
    # The real backends. With CI set, a suite gated on one of these FAILS when it is missing instead
    # of skipping (test/support/backends.ts), so a dropped service cannot silently shrink the run.
    # Test files share each server: Redis keys carry a per-file prefix, every Postgres test gets a
    # schema of its own, and every MySQL test a database of its own.
    env:
      REDIS_URL: redis://127.0.0.1:6379
      DURABLE_REDIS_URL: redis://127.0.0.1:6379
      DURABLE_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      DURABLE_MYSQL_URL: mysql://root:root@127.0.0.1:3306
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

  # The `@adonisjs/queue` peer range spans 0.6 and 0.7, whose adapter contracts differ (0.7 finalizes
  # claims by lease token). The suite above runs on the pinned dev version (0.7); this reruns the
  # durable package on 0.6 against the same real Redis and Postgres (the queue transport's Knex
  # adapter included), so both ends of the range stay green.
  test-queue-compat:
    runs-on: ubuntu-latest
    name: test (@adonisjs/queue 0.6)
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      # MySQL for the specs that opt into it (`dbBackends({ mysql: true })`): the Lucid store contract
      # and the db transport's run queue. Data on tmpfs, so the per-test DDL
      # stays fast; every test gets a database of its own.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --tmpfs /var/lib/mysql
          --health-cmd "mysqladmin ping -uroot -proot --silent"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 60
    # The real backends. With CI set, a suite gated on one of these FAILS when it is missing instead
    # of skipping (test/support/backends.ts), so a dropped service cannot silently shrink the run.
    # Test files share each server: Redis keys carry a per-file prefix, every Postgres test gets a
    # schema of its own, and every MySQL test a database of its own.
    env:
      REDIS_URL: redis://127.0.0.1:6379
      DURABLE_REDIS_URL: redis://127.0.0.1:6379
      DURABLE_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      DURABLE_MYSQL_URL: mysql://root:root@127.0.0.1:3306
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.12.1
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: scripts/test-queue-compat.sh 0.6.2
