name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm build

  # The suite runs on every Node line we support (the range `engines.node` promises): the lines Node
  # itself still maintains that AdonisJS 7 also accepts (it requires >=24).
  # Lint, typecheck and build stay on the single pinned version above: only the test run is multiplied.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    name: test (node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

  # The `@adonisjs/queue` peer range spans 0.6 and 0.7, whose adapter contracts differ (0.7 finalizes
  # claims by lease token). The suite above runs on the pinned dev version (0.7); this reruns the
  # durable package on 0.6, against a real Redis too, so both ends of the range stay green.
  test-queue-compat:
    runs-on: ubuntu-latest
    name: test (@adonisjs/queue 0.6)
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: scripts/test-queue-compat.sh 0.6.2

      - run: scripts/test-queue-compat.sh 0.6.2 test/engine/transports
        env:
          REDIS_URL: redis://127.0.0.1:6379
