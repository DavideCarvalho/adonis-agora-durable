name: Release

# Publishing lives in THIS FILE ONLY, and that is a constraint rather than a preference:
# npm trusted publishing binds each package to exactly one (repository, workflow file) pair,
# so a second workflow that ran `npm publish` could not authenticate. Same shape as
# nestjs-durable's release:
#
#   push to master      -> open/update the "version packages" PR, or publish when it merges
#   run manually        -> throwaway beta snapshot, changesets and git untouched
on:
  push:
    branches: [master]
  workflow_dispatch:

# Never run two releases concurrently (avoids a double-publish race). Shared by both paths
# on purpose: a snapshot racing a real publish is the same hazard.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version PR or Publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the "version packages" commit + git tags
      pull-requests: write # open/update the "version packages" PR
      # Lets the job mint an OIDC token for npm trusted publishing, so a release needs no
      # long-lived NPM_TOKEN. changesets/action probes for this; without it the run logs
      # "No NPM_TOKEN or OIDC available" and never attempts OIDC at all.
      id-token: write
    # The same real backends as ci.yml: the pre-publish `pnpm test` runs with CI set, so a suite gated
    # on one of them fails when it is missing (test/support/backends.ts) — a release must be tested
    # against the real infrastructure, not skip it.
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.0
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm CLI >= 11.5.1; Node 22 still bundles npm 10.x.
      #
      # Pinned to 11.x, NOT @latest: npm 12 changed `npm info <pkg> --json` to return an
      # array of manifests where 11 returned a single packument object. Changesets reads
      # `pkgInfo.versions` off that value, which is `undefined` for an array, so on npm 12
      # EVERY package looks unpublished and it republishes already-live versions, which npm
      # rejects -- turning a fine release red. Revisit when changesets supports npm 12.
      - run: npm install -g 'npm@^11.5.1'

      - run: pnpm install --frozen-lockfile

      # A published version is effectively unrecallable. Every push to master runs this job, and
      # the merge of the "version packages" PR publishes: verify the exact commit being published
      # here, against the real backends, rather than trusting the PR's CI on an older base.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          REDIS_URL: redis://127.0.0.1:6379
          DURABLE_REDIS_URL: redis://127.0.0.1:6379
          DURABLE_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres

      # A Renovate patch/minor bump automerges on its own and brings no changeset with it, so
      # the step below would find nothing to publish and the new dependency would reach npm
      # only whenever someone next released by hand. This writes the changeset for it and
      # versions it in place, leaving the release a plain "nothing pending, publish" run.
      # Majors are merged by a person, so github.actor is not renovate[bot] and none of it runs.
      - name: Release a Renovate dependency bump
        if: github.actor == 'renovate[bot]'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          cat > "$RUNNER_TEMP/renovate-release.mjs" <<'NODE'
          // Writes a patch changeset for a Renovate dependency bump, and only for one: it stays quiet
          // unless a published package's dependencies or peerDependencies actually moved, so lockfile
          // maintenance, devDependency bumps and Actions bumps do not each cut a release.
          import { execFileSync } from "node:child_process";
          import { existsSync, readdirSync, writeFileSync } from "node:fs";

          const before = process.env.BEFORE;
          const after = process.env.AFTER || "HEAD";
          const git = (...args) => execFileSync("git", args, { encoding: "utf8" });
          const skip = (why) => {
            console.log("No dependency release: " + why);
            process.exit(0);
          };

          // A changeset already waiting means a hand-written release is queued behind it. Versioning now
          // would drag that unreleased work out under a dependency bump's name.
          const pending = existsSync(".changeset")
            ? readdirSync(".changeset").filter((f) => f.endsWith(".md") && f.toLowerCase() !== "readme.md")
            : [];
          if (pending.length > 0) skip("changeset(s) already pending (" + pending.join(", ") + ")");
          if (!before || /^0+$/.test(before)) skip("no previous commit to compare against");

          const changed = git("diff", "--name-only", before + ".." + after)
            .split("\n")
            .filter((f) => f === "package.json" || f.endsWith("/package.json"));
          if (changed.length === 0) skip("no package.json changed");

          const readAt = (rev, path) => {
            try {
              return JSON.parse(git("show", rev + ":" + path));
            } catch {
              return null;
            }
          };

          const bumped = [];
          for (const path of changed) {
            const now = readAt(after, path);
            if (!now || !now.name || now.private === true) continue;
            const then = readAt(before, path) || {};
            const moved = ["dependencies", "peerDependencies"].some(
              (field) => JSON.stringify(now[field] || {}) !== JSON.stringify(then[field] || {}),
            );
            if (moved) bumped.push(now.name);
          }
          if (bumped.length === 0) skip("no published package changed a runtime dependency");

          const summary = git("log", "-1", "--pretty=%s", after).trim();
          writeFileSync(
            ".changeset/renovate-" + after.slice(0, 12) + ".md",
            ["---", ...bumped.map((name) => '"' + name + '": patch'), "---", "", summary, ""].join("\n"),
          );
          console.log("Patch release queued for " + bumped.join(", "));
          NODE
          node "$RUNNER_TEMP/renovate-release.mjs"
          if [ -z "$(git status --porcelain .changeset)" ]; then exit 0; fi
          pnpm version-packages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "chore: version packages"
          git push origin HEAD:${{ github.ref_name }}

      # With pending changesets -> opens/updates the "version packages" PR. When that PR is merged
      # (versions bumped, no changesets left) -> runs `pnpm release` (build all + `changeset publish`).
      - name: Create release PR or publish
        uses: changesets/action@v2.1.2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Deliberadamente vazio: o setup-node escreve o .npmrc com
          # _authToken=${NODE_AUTH_TOKEN}, e um token de verdade ali GANHA do OIDC -- o npm
          # usa o token e nunca troca o id-token por credencial. Vazio, o npm ve que nao ha
          # auth e cai no trusted publishing.
          NODE_AUTH_TOKEN: ''

  snapshot:
    name: Publish beta snapshot to npm
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # mints the OIDC credential npm exchanges for a publish token
    steps:
      # Cuts a THROWAWAY prerelease of every package with a pending changeset, published under the
      # `beta` dist-tag as `0.0.0-beta-<timestamp>`. It does NOT consume the changesets, bump source
      # versions, or tag git — so the eventual real release (the "version packages" PR) is untouched
      # and still produces clean semver. Use it to try unreleased work before the real release:
      #   pnpm add @adonis-agora/durable@beta
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.0
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      # Pinned to 11.x for the same reason as in the release job.
      - run: npm install -g 'npm@^11.5.1'

      - run: pnpm install --frozen-lockfile

      # Stamp every pending-changeset package (and any out-of-range dependent) to
      # `0.0.0-beta-<datetime>` in the runner only — never committed.
      - name: Version as beta snapshot
        run: pnpm changeset version --snapshot beta

      - name: Build all packages
        run: pnpm --filter './packages/*' build

      # `@latest` is untouched: these land under the `beta` dist-tag with no git tag.
      - name: Publish beta snapshot
        run: pnpm changeset publish --tag beta --no-git-tag
        env:
          # Empty on purpose, as in the release job: a real token here would win over OIDC.
          NODE_AUTH_TOKEN: ''
